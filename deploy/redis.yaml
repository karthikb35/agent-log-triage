# Single-instance Redis: the queue (Streams) + state store + report blob store.
#
# Sized for the workload, not for durability: at 10-15 KB per report bundle and a
# worst-case ~1,800 in-flight runs, working set is ~30 MB, so a 1 GiB cap with
# `noeviction` never trips. There is deliberately no HA -- a restart drops
# in-flight runs and clients simply resubmit (5-minute retention is enough).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-redis
  labels:
    app.kubernetes.io/name: agentic-log-triage
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-log-triage
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-log-triage
        app.kubernetes.io/component: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - "--maxmemory"
            - "1gb"
            - "--maxmemory-policy"
            - "noeviction"
            - "--appendonly"
            - "no"
          ports:
            - containerPort: 6379
              name: redis
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "1Gi" }
          livenessProbe:
            tcpSocket: { port: redis }
            initialDelaySeconds: 5
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: triage-redis
  labels:
    app.kubernetes.io/name: agentic-log-triage
    app.kubernetes.io/component: redis
spec:
  selector:
    app.kubernetes.io/name: agentic-log-triage
    app.kubernetes.io/component: redis
  ports:
    - port: 6379
      targetPort: redis
